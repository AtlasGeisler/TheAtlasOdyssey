[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-harness"
version = "0.1.0"
description = "An agent harness for the operational and relationship work of a multi-location endodontic practice."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# The real model client. The harness runs offline with the built-in mock provider,
# so anthropic is only needed when config model.provider = anthropic.
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
dental-harness = "dental_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
