---
layout: default
---
<article class="post">
  <header class="post-header">
    <div class="post-meta">{{ page.date | date: "%B %d, %Y" }}</div>
    <h1>{{ page.title }}</h1>
    {% if page.categories %}
    <div class="post-categories">
      {% for cat in page.categories %}<span>{{ cat }}</span>{% endfor %}
    </div>
    {% endif %}
  </header>
  <div class="post-content">
    {{ content }}
  </div>
  <div class="closing-declaration">
    The Atlas Odyssey is not a blog. It is a founding record. The Odyssey continues.
  </div>
</article>
