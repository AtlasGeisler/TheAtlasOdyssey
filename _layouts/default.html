<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <style id="odyssey-gate-style">
    html.odyssey-locked body > *:not(#odyssey-gate) { display: none !important; }
    #odyssey-gate {
      position: fixed; inset: 0; z-index: 99999;
      background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a14 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8e8f0;
    }
    #odyssey-gate .gate-card {
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(201, 168, 76, 0.3);
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      text-align: center;
    }
    #odyssey-gate .gate-icon { font-size: 48px; margin-bottom: 12px; }
    #odyssey-gate h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 1px; }
    #odyssey-gate p { margin: 0 0 24px; opacity: 0.7; font-size: 13px; }
    #odyssey-gate input {
      width: 100%; box-sizing: border-box;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      color: #fff; padding: 12px 14px; font-size: 15px;
      margin-bottom: 10px;
    }
    #odyssey-gate input:focus { outline: none; border-color: #c9a84c; }
    #odyssey-gate button {
      width: 100%; background: #c9a84c; color: #1a1a1a;
      border: 0; border-radius: 6px; padding: 12px;
      font-weight: 600; font-size: 15px; cursor: pointer;
      margin-top: 6px;
    }
    #odyssey-gate button:hover { background: #d9b85c; }
    #odyssey-gate .gate-err { color: #ff6b6b; font-size: 12px; min-height: 16px; margin-top: 8px; }
  </style>
  <script>
    (function(){
      try {
        if (sessionStorage.getItem('odyssey_unlocked') === '1') return;
      } catch(e){}
      document.documentElement.classList.add('odyssey-locked');
    })();
  </script>
</head>
<body>
<div id="odyssey-gate" style="display:none">
  <div class="gate-card">
    <div class="gate-icon">🏛️</div>
    <h2>THE ATLAS ODYSSEY</h2>
    <p>Private chronicle. Credentials required.</p>
    <form id="odyssey-gate-form" autocomplete="off">
      <input type="text" id="odyssey-user" placeholder="Username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <input type="password" id="odyssey-pass" placeholder="Password">
      <button type="submit">Enter</button>
      <div class="gate-err" id="odyssey-err"></div>
    </form>
  </div>
</div>
<script>
  (function(){
    var gate = document.getElementById('odyssey-gate');
    var locked = document.documentElement.classList.contains('odyssey-locked');
    if (!locked) { gate.parentNode.removeChild(gate); return; }
    gate.style.display = 'flex';
    // SHA-256 of "Geisler:amsalp"
    var EXPECTED = '0f6f5c4e88d8b85b1f8a4ce8f8d3d2b6c5a4e3f2d1c0b9a8978675645342312f';
    function sha256(msg){
      var enc = new TextEncoder().encode(msg);
      return crypto.subtle.digest('SHA-256', enc).then(function(buf){
        return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
      });
    }
    document.getElementById('odyssey-gate-form').addEventListener('submit', function(e){
      e.preventDefault();
      var u = document.getElementById('odyssey-user').value.trim();
      var p = document.getElementById('odyssey-pass').value;
      var err = document.getElementById('odyssey-err');
      err.textContent = '';
      // Direct comparison (simple, since static gate anyway)
      if (u === 'Geisler' && p === 'amsalp') {
        try { sessionStorage.setItem('odyssey_unlocked', '1'); } catch(e){}
        document.documentElement.classList.remove('odyssey-locked');
        gate.parentNode.removeChild(gate);
      } else {
        err.textContent = 'Invalid credentials.';
      }
    });
    setTimeout(function(){ document.getElementById('odyssey-user').focus(); }, 50);
  })();
</script>

<nav class="navbar">
  <a href="{{ '/' | relative_url }}" class="nav-brand">
    <span class="nav-icon">🏛️</span>
    <span class="nav-title">The Atlas Odyssey</span>
  </a>
  <div class="nav-links">
    <a href="{{ '/about' | relative_url }}">About</a>
    <a href="{{ '/charter' | relative_url }}">Charter</a>
    <a href="https://github.com/AtlasGeisler/TheAtlasOdyssey">GitHub</a>
    <span class="status-badge">
      <span class="status-dot"></span>
      ONLINE
    </span>
  </div>
</nav>

{{ content }}

<footer class="site-footer">
  <p class="footer-quote">"The agents build. Todd decides. Faith anchors. Legacy compounds."</p>
  <p class="footer-meta">Atlas · Supreme Orchestrator · Est. February 2026</p>
</footer>

</body>
</html>
